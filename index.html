<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>잔향</title>
	<style>
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; color: #b9b4ac; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
		#unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; }
		#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 16px; box-sizing: border-box; background: #000; }
		#loading h1 { margin: 0; font-size: 44px; font-weight: 500; letter-spacing: 0.4em; padding-left: 0.4em; color: #d8d2c8; }
		#bar { width: min(320px, 80vw); height: 2px; background: #1c1b1a; }
		#fill { width: 0; height: 100%; background: #8a2a22; transition: width 0.2s; }
		#note { font-size: 14px; color: #6f6a64; line-height: 1.7; }
		#error { display: none; color: #c0483c; font-size: 15px; }
		#fullscreen { position: fixed; top: 16px; right: 16px; z-index: 5; padding: 8px 14px; border: 1px solid #3a3733; border-radius: 4px; background: rgba(0, 0, 0, 0.55); color: #d8d2c8; font: inherit; font-size: 14px; cursor: pointer; }
		#fullscreen:hover { background: rgba(50, 20, 18, 0.8); }
		#fullscreen[hidden] { display: none; }
	</style>
</head>
<body>
	<canvas id="unity-canvas" tabindex="-1"></canvas>
	<button id="fullscreen" type="button" hidden>전체 화면</button>
	<div id="loading">
		<h1>잔향</h1>
		<div id="bar"><div id="fill"></div></div>
		<div id="note">PC 키보드와 마우스 전용입니다. 헤드폰을 권장합니다.<br>큰 소리와 갑작스러운 장면이 나옵니다.</div>
		<div id="error"></div>
	</div>
	<script>
		// ?mute: 시험할 때 소리를 내지 않는다.
		if (new URLSearchParams(location.search).has('mute')) {
			const connect = AudioNode.prototype.connect;
			AudioNode.prototype.connect = function (target, ...rest) {
				if (!(target instanceof AudioDestinationNode)) return connect.call(this, target, ...rest);
				const context = this.context;
				if (!context.muteNode) {
					context.muteNode = context.createGain();
					context.muteNode.gain.value = 0;
					connect.call(context.muteNode, context.destination);
				}
				return connect.call(this, context.muteNode, ...rest);
			};
		}
	</script>
	<script>
		// 잠금 요청은 Esc 직후처럼 평범하게 거절될 수 있다. 그대로 두면 유니티 로더가 오류 알림창을 띄워 게임을 멈춘다.
		// 마우스 원본 입력을 먼저 시도해 운영체제 가속과 튀는 값을 피한다.
		const requestLock = Element.prototype.requestPointerLock;
		Element.prototype.requestPointerLock = function () {
			const result = requestLock.call(this, { unadjustedMovement: true });
			return result && result.catch ? result.catch(() => requestLock.call(this)).catch(() => {}) : result;
		};
	</script>
	<script src="Build/Web.loader.js"></script>
	<script>
		const canvas = document.getElementById('unity-canvas');
		const loading = document.getElementById('loading');
		const fail = (message) => {
			const error = document.getElementById('error');
			error.textContent = message;
			error.style.display = 'block';
		};
		const config = {
			dataUrl: 'Build/Web.data.unityweb',
			frameworkUrl: 'Build/Web.framework.js.unityweb',
			codeUrl: 'Build/Web.wasm.unityweb',
			streamingAssetsUrl: 'StreamingAssets',
			companyName: 'DefaultCompany',
			productName: 'HorrorGame',
			productVersion: '0.1.0',
			// 고해상도 화면에서 픽셀 수가 몇 배로 늘어 프레임이 무너지지 않게 묶는다.
			devicePixelRatio: 1,
			showBanner: (message, type) => { if (type === 'error') fail(message); else console.warn(message); },
		};
		createUnityInstance(canvas, config, (progress) => {
			document.getElementById('fill').style.width = `${progress * 100}%`;
		}).then((instance) => {
			window.unityInstance = instance;
			loading.remove();
			refreshButton();
			canvas.focus();
		}).catch(fail);
		window.addEventListener('pointerdown', () => canvas.focus());

		const reservedKeys = ['KeyW', 'KeyT', 'KeyN'];
		const fullscreen = document.getElementById('fullscreen');
		const refreshButton = () => {
			fullscreen.hidden = !!document.pointerLockElement || !!document.getElementById('loading');
			fullscreen.textContent = document.fullscreenElement ? '창 모드' : '전체 화면';
		};
		fullscreen.addEventListener('click', async () => {
			if (document.fullscreenElement) {
				if (navigator.keyboard) navigator.keyboard.unlock();
				await document.exitFullscreen();
			} else {
				await document.documentElement.requestFullscreen();
				// 전체 화면에서 Esc를 게임의 일시정지로 쓰고, 브라우저 예약 단축키도 게임이 받는다. Esc를 길게 누르면 전체 화면이 끝난다.
				if (navigator.keyboard) navigator.keyboard.lock(['Escape', ...reservedKeys]).catch(() => {});
			}
			canvas.focus();
		});
		window.addEventListener('keydown', (event) => {
			if ((event.ctrlKey || event.metaKey) && reservedKeys.includes(event.code)) event.preventDefault();
		}, true);
		// 창 모드의 Ctrl+W는 브라우저가 페이지보다 먼저 처리해 막을 수 없다. 닫기 전에 확인만 받는다.
		window.addEventListener('beforeunload', (event) => {
			if (!window.unityInstance) return;
			event.preventDefault();
			event.returnValue = '';
		});
		document.addEventListener('fullscreenchange', refreshButton);
		document.addEventListener('pointerlockchange', refreshButton);
	</script>
</body>
</html>
